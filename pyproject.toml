[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-pipeline"
version = "0.1.0"
description = "PySpark + Airflow pipeline for retail demand: cleaning, weekly demand, ABC classes, quality checks, forecast backtest and Tableau extracts."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yusuf Ömer Erem" }]
requires-python = ">=3.11"
dependencies = ["pyspark>=4.0", "pandas>=2.2", "pyarrow>=15", "openpyxl>=3.1"]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.0"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
